name: Publish CPU LAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swa-cpu-aserdargun-com-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Validate published engineering evidence
        run: python3 scripts/verify_release.py
      - name: Run portable assembler, RTL WASM and mapped-gate tests
        run: npx vitest run tests/assembler.test.ts tests/rtl.test.ts tests/gates.test.ts --reporter=json --outputFile=ci-tests.json
      - name: Verify DEF parser
        run: python3 -m unittest tests/def_routes_test.py
      - name: Build and verify static artifact
        run: |
          npm run build
          python3 scripts/verify_release.py --dist
          python3 scripts/write_release.py
      - name: Publish prebuilt app
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # official v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_CPU_ASERDARGUN_COM }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
          output_location: ""
          production_branch: main
      - name: Save test and release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-release-evidence
          path: |
            ci-tests.json
            dist/release.json
